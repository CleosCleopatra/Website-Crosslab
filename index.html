    <body>
        <div id="header"></div>
        <section class = "hero">
            <div class="hero-text">

                <p class="tagline-text">
                    SOLVE REAL PROBLEMS HALFWAY ACROSS THE WORLD
                </p>
                <h1>
                    Crosslab
                </h1>

                <p class="description">
                    Build together.<br>
                    Learn together.<br>
                    Create impact.
                </p>

                <a href="about_course.html" class="explore_course_button">
                    EXPLORE THE COURSE
                    <img src="images/right_arrow.svg" alt="">
                </a>
            </div>
            
            <img
                src="images/pattern.svg"
                alt=""
                class="geometric-pattern"
            >
        </section>

        <section class = "About_the_course">
            <div class = "text_block_about">

                <h1>
                    What is Crosslab?
                </h1>

                <p id="crosslab_basic_info_text"></p>
                <script>
                    fetch("text/what_is_crosslab_summary.txt")
                        .then(response => response.text())
                        .then(data => {
                            document.getElementById("crosslab_basic_info_text").innerHTML = data;
                        });
                </script>
            </div>

            <div class="student_pic_image_holder">
                <img
                    src = "images/student_pic.jpeg"
                    alt = ""
                    class = "about_course_image"
                >
            </div>




        </section>
        <section class="facts_block">
            <div class = "facts_block_only">
                <div class ="info_block">
                    <img
                        src="images/clock-0500-svgrepo-com.svg"
                        alt = ""
                        class="info_image"
                    >
                    <h1>
                        Duration
                    </h1>
                    <p>
                        4 weeks
                    </p>
                    <p>
                        (1 evening/week)
                    </p>
                </div>
                <div class="vl"></div>
                <div class ="info_block">
                    <img
                        src="images/location-pin-svgrepo-com.svg"
                        alt = ""
                        class="info_image"
                    >
                    <h1>
                        Location
                    </h1>
                    <p>
                        Sweden: FUSE
                    </p>
                    <p>
                        Rwanda: UniPod
                    </p>
                </div>

                
                <div class="vl"></div>

                <div class ="info_block">
                    <img
                        src="images/people-svgrepo-com.svg"
                        alt =""
                        class = "info_image"
                    >
                    <h1>
                        Who its for
                    </h1>
                    <p>
                        Engineering and architecture students
                        at Chalmers and UR
                    </p>
                    
                </div>

            </div>

        </section>
