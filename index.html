<!DOCTYPE html>

<html lang = "en">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width = device-width, initial-scale=1.0">

        <title>Crosslab</title>
        <link rel = "stylesheet" href = "css/style.css">
        <link rel="stylesheet" href="css/components.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    </head>

    <body>
        <div id="header"></div>
        <section class = "hero">
            <div class="hero-text">

                <p class="tagline-text">
                    SOLVE REAL PROBLEMS HALFWAY ACROSS THE WORLD
                </p>
                <h1>
                    Crosslab
                </h1>

                <p class="description">
                    Build together.<br>
                    Learn together.<br>
                    Create impact.
                </p>

                <a href="about_course.html" class="explore_course_button">
                    EXPLORE THE COURSE
                    <img src="images/right_arrow.svg" alt="">
                </a>
            </div>
            
            <img
                src="images/pattern.svg"
                alt=""
                class="geometric-pattern"
            >
        </section>

        

        <section class = "new_facts_block"> 
            <dl class="table_info">
                <div class = "grid_item"> 
                    <dt class = "grid_title">
                        Cost
                    </dt>
                    <dd class = "grid_information">
                        Free
                    </dd>
                </div>
                <div class = "grid_item">
                    <dt class ="grid_title">
                        Length
                    </dt>
                    <dd class = "grid_information">
                        4 weeks
                    </dd>
                </div>
                <div class = "grid_item">
                    <dt class = "grid_title">
                        Format
                    </dt>
                    <dl class = "grid_information"> 
                        1 evening/week
                    </dl>
                </div>
                <div class="grid_item">
                    <dt class = "grid_title">
                        Start date
                    </dt>
                    <dl class = "grid_information">
                        19 Jan 1975
                    </dl>
                </div>
            </dl>
        </section>
        
        <div id="footer"></div>
        <script src="js/components.js"></script>
    </body>
</html>
